    instructions_shorter: Просмотрите цели и узнайте о тенденциях в Центральной Азии и за ее пределами
  frontpage_cards :
    knowsdgs_title : Что такое ЦУР?
    knowsdgs_content : '<iframe width="100%" height="350" src="https://www.youtube.com/embed/xdPe-5damxo?si=4HVKGT93QB9bWcD7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>'
    accelerators_title : Акселераторы ЦУР
    accelerators_content : '<iframe src="https://embed.kumu.io/53c476594ba538d25599c61403c209b2" width="100%" height="350" frameborder="0"></iframe>'
    eu4sdgs_title : Вклад ЕС в ЦУР
    eu4sdgs_content : '<iframe src="https://embed.kumu.io/083cfca48af0e01017cb30b94ee7c9bd" width="100%" height="350" frameborder="0"></iframe>'
    intro_title: Что такое Платформа ЦУР Центральной Азии?
    intro_body : >
      Страны Центральной Азии взяли на себя обязательство реализовать Повестку дня на период до 2030 года и интегрировать Цели устойчивого развития (ЦУР) в свои национальные планы. Эта Платформа была разработана с целью внести вклад в устойчивое развитие посредством обмена знаниями и сотрудничества в Центральной Азии (проект [реализуется ПРООН](https://www.undp.org/eurasia), [финансируется ЕС](https://www.eeas.europa.eu/eeas/central-asia_en)). Платформа, поддерживающая страны в [отслеживании прогресса в достижении ЦУР](https://central-asia-sdg-platform.github.io/www/ru/goals), [отслеживании ключевых социально-экономических политик](https://central-asia-sdg-platform.github.io/www/ru/policies), [моделировании сценариев для путей достижения ЦУР](https://central-asia-sdg-platform.github.io/www/ru/sdg-scenarios), определении [точек ускорения через системный взгляд](https://central-asia-sdg-platform.github.io/www/ru/systems) и продвижение [комплексных подходов к финансированию ЦУР](https://central-asia-sdg-platform.github.io/www/ru/finances).
      Достижение ЦУР — это совместные усилия, требующие партнерства и вовлечения всего общества. [Парламенты](https://central-asia-sdg-platform.github.io/www/ru/parliaments) и Правительства, [частный сектор](https://central-asia-sdg-platform.github.io/www/ru/private-sector) и [академические круги](https://central-asia-sdg-platform.github.io/www/ru/academia), [гражданское общество](https://central-asia-sdg-platform.github.io/www/ru/cso-and-ngo), у каждого есть своя роль в достижении ЦУР. Большая часть прогресса происходит на местном уровне, в городах и сообществах, поэтому [Локализация ЦУР](https://central-asia-sdg-platform.github.io/www/ru/sdg-local) является важной задачей.
      Страны Центральной Азии активно осмысливают итоги и уроки прогресса посредством [Добровольных национальных обзоров](https://central-asia-sdg-platform.github.io/www/ru/vnr) и ряда [Добровольных местных обзоров](https://sdgs.un.org/topics/voluntary-local-reviews) в настоящее время находятся в стадии подготовки.
      Этот богатый массив знаний, а также общие и зачастую трансграничные проблемы являются призывом Центральной Азии к сотрудничеству и обмену знаниями.

